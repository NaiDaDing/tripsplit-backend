name: CD / Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      deploy_to_ecs:
        description: "Deploy image to ECS service"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main

env:
  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_URI: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
  DEPLOY_TO_ECS: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_ecs == 'true' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_URI .

      - name: Push Docker image to ECR
        run: |
          docker push $IMAGE_URI

      - name: Download current ECS task definition
        if: ${{ env.DEPLOY_TO_ECS == 'true' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            > task-definition.json

      - name: Render new ECS task definition
        if: ${{ env.DEPLOY_TO_ECS == 'true' }}
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy ECS task definition
        if: ${{ env.DEPLOY_TO_ECS == 'true' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Scale ECS service to 1 task
        if: ${{ env.DEPLOY_TO_ECS == 'true' }}
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --desired-count 1

      - name: Wait for ECS service to become stable
        if: ${{ env.DEPLOY_TO_ECS == 'true' }}
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}

      - name: Prepare ALB DNS name
        if: ${{ env.DEPLOY_TO_ECS == 'true' }}
        id: alb-dns
        run: |
          ALB_DNS_NAME="$(echo "${{ vars.ALB_DNS_NAME }}" | xargs)"
          echo "alb_dns_name=$ALB_DNS_NAME" >> "$GITHUB_OUTPUT"

      - name: Smoke test health endpoint
        if: ${{ env.DEPLOY_TO_ECS == 'true' && steps.alb-dns.outputs.alb_dns_name != '' }}
        run: |
          curl --fail --retry 10 --retry-delay 10 \
            http://${{ steps.alb-dns.outputs.alb_dns_name }}/healthz
